<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Sample team: The Ossuary Boys. A bone-white skull over crossed bones on a dark green
       roundel. Made for the studio's sample data, not a real team. -->
  <circle cx="100" cy="100" r="94" fill="#e8dcc4"/>
  <circle cx="100" cy="100" r="86" fill="#1a2a24"/>
  <circle cx="100" cy="100" r="76" fill="none" stroke="#e8dcc4" stroke-width="2" stroke-dasharray="3 6" opacity="0.6"/>
  <!-- crossed bones -->
  <g fill="#e8dcc4" stroke="#1a2a24" stroke-width="3">
    <g transform="rotate(42 100 112)">
      <rect x="93" y="48" width="14" height="128" rx="6"/>
      <circle cx="93" cy="50" r="10"/><circle cx="107" cy="50" r="10"/>
      <circle cx="93" cy="174" r="10"/><circle cx="107" cy="174" r="10"/>
    </g>
    <g transform="rotate(-42 100 112)">
      <rect x="93" y="48" width="14" height="128" rx="6"/>
      <circle cx="93" cy="50" r="10"/><circle cx="107" cy="50" r="10"/>
      <circle cx="93" cy="174" r="10"/><circle cx="107" cy="174" r="10"/>
    </g>
  </g>
  <!-- the skull -->
  <path d="M100 42 C130 42 148 62 148 88 C148 104 140 114 132 119 L130 134 L70 134 L68 119 C60 114 52 104 52 88 C52 62 70 42 100 42 Z" fill="#e8dcc4" stroke="#1a2a24" stroke-width="4"/>
  <path d="M74 132 L74 150 C74 154 78 156 82 156 L118 156 C122 156 126 154 126 150 L126 132 Z" fill="#e8dcc4" stroke="#1a2a24" stroke-width="4"/>
  <g fill="#1a2a24">
    <path d="M70 92 C70 80 92 78 94 92 C95 104 84 110 78 108 C72 106 70 100 70 92 Z"/>
    <path d="M130 92 C130 80 108 78 106 92 C105 104 116 110 122 108 C128 106 130 100 130 92 Z"/>
    <path d="M100 108 L93 122 L107 122 Z"/>
    <rect x="84" y="138" width="3" height="16"/><rect x="93" y="138" width="3" height="16"/>
    <rect x="104" y="138" width="3" height="16"/><rect x="113" y="138" width="3" height="16"/>
  </g>
  <!-- a red glint in one socket -->
  <circle cx="120" cy="94" r="4" fill="#c0482c"/>
</svg>
